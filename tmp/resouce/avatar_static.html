<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            html, body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: transparent;
            }

            #avatar {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: contain;
                object-position: center bottom;
            }
        </style>
    </head>
    <body>
        <img id="avatar" src="images/avatar.jpg">
    </body>
</html>
